<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置密码 - 你画我猜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --error: #ef4444;
            --success: #22c55e;
        }
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 50%, #fef3c7 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .form-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }
        .btn-primary {
            background: var(--accent);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass rounded-2xl shadow-xl w-full max-w-md p-8">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">你画我猜</h1>
            <p class="text-slate-500">设置密码</p>
        </div>

        <!-- 消息提示 -->
        <div id="messageBox" class="hidden mb-4 p-3 rounded-lg text-center text-sm"></div>

        <!-- 设置密码表单 -->
        <form id="setPasswordForm" class="space-y-4">
            <!-- 邮箱 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">邮箱</label>
                <div class="flex gap-2">
                    <input type="email" id="email" class="form-input flex-1 px-4 py-3 rounded-xl" placeholder="请输入已绑定的邮箱" required>
                    <button type="button" id="sendCodeBtn" class="px-4 py-3 rounded-xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition-colors whitespace-nowrap" onclick="sendCode()">
                        发送验证码
                    </button>
                </div>
            </div>

            <!-- 验证码 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">验证码</label>
                <input type="text" id="verifyCode" class="form-input w-full px-4 py-3 rounded-xl" placeholder="请输入6位验证码" maxlength="6" required>
            </div>

            <!-- 新密码 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">新密码</label>
                <div class="relative">
                    <input type="password" id="newPassword" class="form-input w-full px-4 py-3 rounded-xl pr-12" placeholder="至少8位，包含字母和数字" required>
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" onclick="togglePassword('newPassword')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- 确认密码 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">确认密码</label>
                <input type="password" id="confirmPassword" class="form-input w-full px-4 py-3 rounded-xl" placeholder="请再次输入密码" required>
            </div>

            <!-- 设置按钮 -->
            <button type="submit" class="btn-primary w-full py-3 rounded-xl text-white font-medium">
                设置密码
            </button>
        </form>

        <!-- 底部链接 -->
        <div class="mt-6 text-center text-sm text-slate-500">
            <span class="link-btn" onclick="goBack()">返回设置</span>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        // 显示消息
        function showMessage(text, type = 'error') {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = `mb-4 p-3 rounded-lg text-center text-sm ${type === 'error' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`;
            box.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('messageBox').classList.add('hidden');
        }

        // 切换密码显示
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // 发送验证码
        let sendCooldown = 0;
        async function sendCode() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMessage('请输入邮箱');
                return;
            }

            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/auth/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, type: 'reset' })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    startCooldown(60);
                } else {
                    showMessage(data.error || '发送失败');
                    if (data.remainingTime) {
                        startCooldown(data.remainingTime);
                    } else {
                        btn.disabled = false;
                    }
                }
            } catch (e) {
                showMessage('网络错误，请重试');
                btn.disabled = false;
            }
        }

        function startCooldown(seconds) {
            sendCooldown = seconds;
            const btn = document.getElementById('sendCodeBtn');
            const timer = setInterval(() => {
                sendCooldown--;
                if (sendCooldown > 0) {
                    btn.textContent = `${sendCooldown}秒`;
                } else {
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                    clearInterval(timer);
                }
            }, 1000);
        }

        // 设置密码表单提交
        document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('verifyCode').value.trim();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 验证
            if (!email || !code || !password || !confirmPassword) {
                showMessage('请填写完整信息');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致');
                return;
            }

            if (password.length < 8) {
                showMessage('密码长度不能少于8位');
                return;
            }

            if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                showMessage('密码必须包含字母和数字');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = '设置中...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/set-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, password })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage('密码设置成功', 'success');
                    setTimeout(() => {
                        window.location.href = '/settings.html';
                    }, 1500);
                } else {
                    showMessage(data.error || '设置失败');
                }
            } catch (e) {
                showMessage('网络错误，请重试');
            }

            btn.disabled = false;
            btn.textContent = '设置密码';
        });

        // 页面跳转
        function goBack() {
            window.location.href = '/settings.html';
        }
    </script>
</body>
</html>
