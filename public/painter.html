        const targetGrid = document.getElementById('targetGrid');
        const btnNext = document.getElementById('btnNext');
        const btnRefresh = document.getElementById('btnRefresh');
        const refreshCount = document.getElementById('refreshCount');
        const currentTarget = document.getElementById('currentTarget');
        const currentTargetText = document.getElementById('currentTargetText');
        const currentTargetTimer = document.getElementById('currentTargetTimer');

        let wordCandidates = [];
        let refreshLeft = 3;
        let selectedIndex = null;
        let selectedWord = null;

        // 渲染候选词汇网格
        function renderCandidates(candidates) {
            if (!candidates || candidates.length === 0) return;

            wordCandidates = candidates;
            targetGrid.innerHTML = '';

            candidates.forEach((candidate, index) => {
                const word = typeof candidate === 'string' ? candidate : candidate.word;
                const category = typeof candidate === 'string' ? '' : (candidate.category || '');

                const card = document.createElement('div');
                card.className = 'target-card';
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="target-card-name" style="font-size: 18px; margin-bottom: 6px;">${word}</div>
                    ${category ? `<div style="font-size: 12px; color: var(--text-secondary);">${category}</div>` : ''}
                `;
                card.addEventListener('click', () => selectCandidate(index));
                targetGrid.appendChild(card);
            });

            // 恢复选中状态
            if (selectedIndex !== null && selectedIndex >= 0 && selectedIndex < candidates.length) {
                const cards = targetGrid.querySelectorAll('.target-card');
                if (cards[selectedIndex]) {
                    cards[selectedIndex].classList.add('selected');
                }
            }
        }

        // 选择候选词汇
        function selectCandidate(index) {
            selectedIndex = index;
            selectedWord = wordCandidates[index];

            // 更新选中状态
            document.querySelectorAll('.target-card').forEach(card => {
                card.classList.remove('selected');
                if (parseInt(card.dataset.index) === index) {
                    card.classList.add('selected');
                }
            });

            btnNext.disabled = false;
        }

        // 更新刷新按钮显示
        function updateRefreshButton(left) {
            refreshLeft = left;
            refreshCount.textContent = `(剩余 ${left} 次)`;
            btnRefresh.disabled = left <= 0;
        }

        // 显示选词面板
        function showWordSelector(candidates, left) {
            selectedIndex = null;
            selectedWord = null;
            btnNext.disabled = true;
            renderCandidates(candidates);
            updateRefreshButton(left);
            targetModal.classList.add('show');
        }

        // 开始绘画
        btnNext.addEventListener('click', () => {
            if (!selectedWord) return;

            // 关闭弹窗，显示绘画目标
            const wordToSend = typeof selectedWord === 'string' ? selectedWord : (selectedWord && selectedWord.word);
            targetModal.classList.remove('show');
            currentTarget.classList.add('show');
            currentTargetText.textContent = `正在绘画: ${wordToSend || ''}`;

            // 将选择的词语同步给服务器（只发送字符串，不要发送对象）
            if (socketClient && socketClient.roomCode && wordToSend) {
                socketClient.selectWord(wordToSend);
            }

            // 启动快照同步（用于中途加入同步）
            startSnapshotSync();
        });

        // 刷新候选词汇
        btnRefresh.addEventListener('click', async () => {
            if (refreshLeft <= 0) return;

            btnRefresh.disabled = true;
            try {
                const response = await socketClient.refreshWords();
                if (response.candidates) {
                    selectedIndex = null;
                    selectedWord = null;
                    btnNext.disabled = true;
                    renderCandidates(response.candidates);
                    updateRefreshButton(response.refreshLeft);
                }
            } catch (error) {
                console.error('刷新词汇失败:', error);
                alert(error.message || '刷新失败');
                updateRefreshButton(refreshLeft);
            }
        });
    </script>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/game-state.js"></script>
    <script src="js/bgm-manager.js"></script>
    <script>
        // 初始化 BGM 管理器
        window.addEventListener('DOMContentLoaded', () => {
            window.initBGM('bgm');
        });

        // ===== Socket.io 集成 =====
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('roomCode');
        const roomName = urlParams.get('roomName') || '游戏房间';
        const playerName = urlParams.get('playerName');
        const playerAvatar = urlParams.get('playerAvatar');
        let currentWord = null;

        // 生成头像颜色
        function getAvatarColor(name) {
            const colors = [
                'linear-gradient(135deg, #6366F1, #8B5CF6)',
                'linear-gradient(135deg, #FB923C, #F97316)',
                'linear-gradient(135deg, #22C55E, #16A34A)',
                'linear-gradient(135deg, #FBBF24, #F59E0B)',
                'linear-gradient(135deg, #EF4444, #DC2626)',
                'linear-gradient(135deg, #EC4899, #F472B6)'
            ];
            if (!name) return colors[0];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        let currentPlayers = [];
        let hasGameEnded = false; // 游戏结束弹窗显示后，不再自动跳转
        let lastRoomStatus = ''; // 用于检测游戏结束状态流转

        async function initSocket() {
            try {
                if (!roomCode || !playerName) {
                    console.error('缺少房间代码或玩家名称');
                    return;
                }

                await socketClient.connect();
                console.log('绘画者已连接到服务器');

                // ===== 先注册所有 socket 事件监听，再 joinRoom =====
                // 这样服务器在 joinRoom 回调中同步的事件（如 wordCandidates）才不会丢失

                // 监听房间数据更新
                socketClient.on('roomUpdate', (room) => {
                    currentPlayers = room.players || [];
                    const newStatus = room.status || '';

                    // 若 roomUpdate 先于 gameEnded 到达，检测到 playing -> finished/waiting 时主动展示结算弹窗
                    if (!hasGameEnded && lastRoomStatus === 'playing' && (newStatus === 'finished' || newStatus === 'waiting')) {
                        hasGameEnded = true;
                        const rankings = (room.players || []).sort((a, b) => (b.score || 0) - (a.score || 0)).map((p, i) => ({
                            rank: i + 1,
                            name: p.name,
                            avatar: p.avatar,
                            score: p.score || 0,
                            isHost: p.isHost
                        }));
                        showGameEndRankings(rankings);
                        lastRoomStatus = newStatus;
                        return;
                    }
                    lastRoomStatus = newStatus;

                    // 游戏结束弹窗显示期间，不自动跳转，等待用户手动返回房间
                    if (hasGameEnded) return;

                    // 状态机校验：房间状态变化时自动修正页面
                    const shouldStay = GameState.enforce(
                        room,
                        socketClient.playerId,
                        'painter',
                        {
                            roomCode: roomCode,
                            roomName: roomName || '',
                            playerName: playerName,
                            playerAvatar: playerAvatar || ''
                        }
                    );
                    if (!shouldStay) return;
                });

                // 监听猜词正确：不显示答案，只提示有人猜对
                socketClient.on('guessCorrect', ({ playerId, playerName, playerAvatar, score }) => {
                    showGuessResult(playerName, null, true, score);
                    // 同步到弹幕
                    addBarrage(`${playerName} 猜对了！`, playerName, getAvatarColor(playerName), playerAvatar);
                });

                // 监听猜词尝试
                socketClient.on('guessAttempt', ({ playerName, playerAvatar, guess, isCorrect }) => {
                    if (!isCorrect) {
                        addBarrage(guess, playerName, getAvatarColor(playerName), playerAvatar);
                    }
                });

                // 监听聊天消息
                socketClient.on('chatMessage', ({ playerName, playerAvatar, message }) => {
                    addBarrage(message, playerName, getAvatarColor(playerName), playerAvatar);
                });

                // 监听候选词汇列表（只有绘画者能收到）
                socketClient.on('wordCandidates', ({ candidates, refreshLeft }) => {
                    console.log('收到候选词汇:', candidates, '剩余刷新次数:', refreshLeft);
                    showWordSelector(candidates, refreshLeft);
                });

                // 监听绘画者专用词汇（只有绘画者能收到）
                socketClient.on('painterWord', ({ word, category, hint }) => {
                    currentWord = word;
                    const targetTextEl = document.getElementById('currentTargetText');
                    if (targetTextEl) {
                        targetTextEl.textContent = `正在绘画: ${word}`;
                    }
                    if (currentTarget) {
                        currentTarget.classList.add('show');
                    }
                    if (hint) {
                        const hintEl = document.querySelector('.current-target-hint');
                        if (hintEl) hintEl.textContent = `分类：${category || ''} | 提示：${hint}`;
                    }
                });

                // 监听回合开始（绘画者切换）
                socketClient.on('roundStarted', ({ round, totalRounds, painterId, timer, selecting }) => {
                    console.log('回合开始:', round, '绘画者:', painterId, '选择中:', selecting);

                    // 判断当前用户是否还是绘画者
                    if (painterId !== socketClient.socket.id) {
                        console.log('绘画者已切换，跳转到竞猜者页面');
                        // 如果不是绘画者了，跳转到竞猜者页面
                        const gameParams = new URLSearchParams({
                            roomCode: roomCode,
                            roomName: roomName || '游戏房间',
                            playerName: playerName,
                            playerAvatar: playerAvatar || '',
                            round: round,
                            totalRounds: totalRounds || 5
                        });
                        window.isRoleSwitching = true;
                        window.location.replace(`guesser.html?${gameParams.toString()}`);
                    } else {
                        console.log('继续作为绘画者');
                        // 更新回合信息显示
                        const roundBadge = document.getElementById('roundBadge');
                        if (roundBadge) {
                            roundBadge.textContent = `第 ${round} / ${totalRounds || 5} 回合`;
                        }
                        // 选择词汇阶段不显示目标浮层，等待绘画者选择
                        if (!selecting && currentTarget) {
                            currentTarget.classList.add('show');
                        }
                        if (timer !== undefined && !selecting) {
                            updatePainterTimer(timer);
                        }
                    }
                });

                // 监听服务端权威计时同步
                socketClient.on('timerUpdate', ({ remainingTime }) => {
                    updatePainterTimer(remainingTime);
                });

                // 监听回合结束
                socketClient.on('roundEnded', ({ message, word }) => {
                    updatePainterTimer(0);
                    // 停止快照同步
                    stopSnapshotSync();
                    alert(`${message || '本轮结束！'} ${word || ''}`);
                });

                // 监听游戏结束
                socketClient.on('gameEnded', ({ room, rankings }) => {
                    hasGameEnded = true;
                    // 停止快照同步
                    stopSnapshotSync();
                    showGameEndRankings(rankings || (room && room.players));
                });

                // 监听房间销毁
                socketClient.on('roomDestroyed', ({ message }) => {
                    alert(message || '房主已离开，房间已销毁');
                    window.location.replace('lobby.html');
                });

                // 绘画者也需要加入房间以同步状态
                const joinResponse = await socketClient.joinRoom(roomCode, playerName, null, playerAvatar);
                console.log('绘画者已加入房间:', socketClient.roomCode);
                if (joinResponse && joinResponse.room) {
                    currentPlayers = joinResponse.room.players || [];
                    lastRoomStatus = joinResponse.room.status || '';

                    // 状态机校验：确保当前页面与房间状态匹配
                    const shouldStay = GameState.enforce(
                        joinResponse.room,
                        socketClient.playerId,
                        'painter',
                        {
                            roomCode: roomCode,
                            roomName: roomName || '',
                            playerName: playerName,
                            playerAvatar: playerAvatar || ''
                        }
                    );
                    if (!shouldStay) return;
                }

            } catch (error) {
                console.error('连接失败:', error);
            }
        }

        // 显示猜词结果
        function showGuessResult(playerName, guess, correct, score) {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'guess-result';
            const guessText = guess ? `猜对了: ${guess}` : '猜对了';
            resultDiv.innerHTML = `
                <div class="guess-result-content ${correct ? 'correct' : 'wrong'}">
                    <span class="player-name">${playerName}</span>
                    <span class="guess-text">${guessText}</span>
                    <span class="score">+${score}分</span>
                </div>
            `;
            document.body.appendChild(resultDiv);

            setTimeout(() => {
                resultDiv.remove();
            }, 3000);
        }

        // 显示游戏结束排行榜
        function showGameEndRankings(rankings) {
            const overlay = document.getElementById('gameEndOverlay');
            const list = document.getElementById('rankingList');
            if (!overlay || !list) return;

            const players = Array.isArray(rankings) && rankings.length > 0 && rankings[0].score !== undefined
                ? rankings
                : (rankings || []).sort((a, b) => (b.score || 0) - (a.score || 0)).map((p, i) => ({
                    rank: i + 1,
                    name: p.name,
                    avatar: p.avatar,
                    score: p.score || 0,
                    isHost: p.isHost
                }));

            list.innerHTML = '';
            players.forEach((player, index) => {
                const rank = player.rank || index + 1;
                let topClass = '';
                let numClass = 'normal';
                if (rank === 1) { topClass = 'top1'; numClass = 'gold'; }
                else if (rank === 2) { topClass = 'top2'; numClass = 'silver'; }
                else if (rank === 3) { topClass = 'top3'; numClass = 'bronze'; }

                const avatarHtml = player.avatar && player.avatar.includes('<svg')
                    ? player.avatar
                    : `<div class="ranking-avatar-fallback">${player.name ? player.name[0] : '?'}</div>`;

                const hostBadge = player.isHost ? '<span class="ranking-host">房主</span>' : '';

                const item = document.createElement('div');
                item.className = `ranking-item ${topClass}`;
                item.innerHTML = `
                    <div class="ranking-num ${numClass}">${rank}</div>
                    <div class="ranking-avatar">${avatarHtml}</div>
                    <div class="ranking-info">
                        <div class="ranking-name">${player.name || '匿名'}${hostBadge}</div>
                    </div>
                    <div class="ranking-score">${player.score || 0}</div>
                `;
                list.appendChild(item);
            });

            overlay.classList.add('show');
        }

        // 返回房间
        function backToRoom() {
            const me = currentPlayers.find(p => p.id === socketClient.playerId);
            const isHost = me ? me.isHost : false;
            const params = new URLSearchParams({
                roomCode: roomCode,
                roomName: roomName || '游戏房间',
                playerName: playerName,
                playerAvatar: playerAvatar || '',
                status: '等待中',
                isHost: isHost ? 'true' : 'false'
            });
            window.isRoleSwitching = true;
            window.location.replace(`room-lobby.html?${params.toString()}`);
        }

        document.getElementById('btnBackToRoom').addEventListener('click', backToRoom);

        // 发送画布数据（兼容旧方式，现在主要使用矢量笔迹同步）
        function sendCanvasData() {
            const imageData = canvas.toDataURL('image/png', 0.5);
            socketClient.sendCanvasUpdate(imageData, roomCode);
        }

        // 发送画布快照（用于中途加入同步）
        function sendCanvasSnapshot() {
            const imageData = canvas.toDataURL('image/png', 0.5);
            const timestamp = Date.now();
            socketClient.sendCanvasSnapshot(imageData, timestamp, roomCode);
        }

        // 定时发送画布数据（降低频率，兼容旧方式）
        let canvasSendInterval = null;
        function startCanvasSync() {
            if (canvasSendInterval) return;
            canvasSendInterval = setInterval(() => {
                sendCanvasData();
            }, 200); // 每200ms发送一次
        }

        function stopCanvasSync() {
            if (canvasSendInterval) {
                clearInterval(canvasSendInterval);
                canvasSendInterval = null;
            }
        }

        // 定时发送快照（用于中途加入同步）
        let snapshotInterval = null;
        const SNAPSHOT_INTERVAL = 5000; // 每 5 秒发送一次快照

        function startSnapshotSync() {
            if (snapshotInterval) return;
            // 立即发送一次快照
            sendCanvasSnapshot();
            snapshotInterval = setInterval(() => {
                sendCanvasSnapshot();
            }, SNAPSHOT_INTERVAL);
        }

        function stopSnapshotSync() {
            if (snapshotInterval) {
                clearInterval(snapshotInterval);
                snapshotInterval = null;
            }
        }

        // 监听绘制事件，触发同步（兼容旧方式）
        canvas.addEventListener('mouseup', sendCanvasData);
        canvas.addEventListener('mouseleave', sendCanvasData);

        // 初始化连接
        initSocket();

        // 绘画开始时启动同步
        canvas.addEventListener('mousedown', () => {
            startCanvasSync();
        });

        // 绘画结束时停止同步
        canvas.addEventListener('mouseup', () => {
            stopCanvasSync();
            sendCanvasData(); // 最后发送一次完整数据
        });

        // ===== 防误触退出功能 =====
        window.addEventListener('beforeunload', (e) => {
            if (window.isRoleSwitching) {
                return;
            }
            if (socketClient.socket && socketClient.socket.connected) {
                e.preventDefault();
                e.returnValue = '你正在绘画中，离开将导致本局游戏异常，确定要退出吗？';
                return e.returnValue;
            }
        });
    </script>
