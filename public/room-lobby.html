<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房间详情 - 你画我猜</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/room-lobby.css">
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
    </div>

    <!-- 房间内界面 -->
    <div class="room-lobby-container">
        <div class="room-lobby-header">
            <div class="room-header-left">
                <div class="room-lobby-title" id="roomTitle">房间详情</div>
                <div class="room-info-badge">
                    <div class="room-info-badge-item room-id-badge">
                        <span class="room-info-badge-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="9" y1="9" x2="15" y2="9"></line>
                                <line x1="9" y1="15" x2="15" y2="15"></line>
                            </svg>
                        </span>
                        <span>ID: <strong id="roomIdDisplay">---</strong></span>
                    </div>
                    <div class="room-info-badge-item room-name-badge">
                        <span class="room-info-badge-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                            </svg>
                        </span>
                        <span id="roomName">未命名房间</span>
                    </div>
                    <div class="room-info-badge-item">
                        <span class="room-info-badge-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                            </svg>
                        </span>
                        <span id="roomType">经典模式</span>
                    </div>
                </div>
            </div>
            <div class="room-header-right">
                <div class="room-info-badge">
                    <div class="room-info-badge-item">
                        <span class="room-info-badge-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                        </span>
                        <span id="roomPlayerCount">0/0</span>
                    </div>
                    <div class="room-info-badge-item">
                        <span class="room-info-badge-icon">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"></circle>
                                <circle cx="12" cy="12" r="6"></circle>
                                <circle cx="12" cy="12" r="2"></circle>
                            </svg>
                        </span>
                        <span id="roomStatusText">等待中</span>
                    </div>
                    <div class="room-info-badge-item">
                        <span class="room-info-badge-icon">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </span>
                        <span id="roomRoundTime">90秒</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="room-refresh-btn" id="btnRefreshRoom" onclick="refreshRoomData()">
                    <svg viewBox="0 0 24 24">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </div>
                <div class="room-lobby-close" id="roomLobbyClose" onclick="leaveRoom()">
                    <svg viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
            </div>
        </div>

        <div class="room-lobby-content">
            <!-- 房间说明 -->
            <div class="room-tip-box">
                <div class="room-tip-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                </div>
                <div class="room-tip-content">
                    <div class="room-tip-title">座位说明</div>
                    <div class="room-tip-text">座位顺序即为游戏绘画顺序，第一个座位为首位绘画者。游戏开始后，将按座位顺序轮流绘画。</div>
                </div>
            </div>
            <div class="players-grid" id="playersGrid">
                <!-- 玩家卡片会动态生成 -->
            </div>
        </div>

        <div class="room-lobby-footer">
            <button class="room-lobby-btn room-lobby-btn-secondary" id="btnLeaveRoom" onclick="leaveRoom()">
                <svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                退出房间
            </button>
            <button class="room-lobby-btn room-lobby-btn-warning" id="btnReady" onclick="toggleReady()" style="display: none;">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="btnReadyText">准备</span>
            </button>
            <button class="room-lobby-btn room-lobby-btn-primary" id="btnStartGame" onclick="startGame()">
                <svg viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                开始游戏
            </button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/game-state.js"></script>
    <script src="js/avatar-library.js"></script>
    <script src="js/bgm-manager.js"></script>
    <script src="js/room-lobby.js"></script>

    <!-- 背景音乐 -->
    <audio id="bgm" loop>
        <source src="background_music/GameRoom.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 初始化 BGM 管理器
        window.addEventListener('DOMContentLoaded', () => {
            window.initBGM('bgm');
        });
    </script>
</body>
</html>
