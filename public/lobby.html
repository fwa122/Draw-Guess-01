<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你画我猜 - 游戏大厅</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/lobby.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/leaderboard-widget.css">
</head>
<body>
    <!-- 浮动光斑装饰 -->
    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>
    <div class="floating-orb orb-4"></div>
    <div class="floating-orb orb-5"></div>
    <div class="floating-orb orb-6"></div>

    <!-- 动态气泡装饰 -->
    <div class="bubbles-container">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
        <div class="bubble b5"></div>
        <div class="bubble b6"></div>
        <div class="bubble b7"></div>
        <div class="bubble b8"></div>
        <div class="bubble b9"></div>
        <div class="bubble b10"></div>
    </div>

    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    <path d="M2 2l7.586 7.586"></path>
                    <circle cx="11" cy="11" r="2"></circle>
                </svg>
            </div>
            <div class="logo-text">你画<span>我猜</span></div>
        </div>

        <div class="header-right">
            <div class="online-stats">
                <div class="online-stats-dot"></div>
                <span id="onlineStats">0 人在线</span>
            </div>
            <!-- 用户状态 -->
            <div id="userStatus" class="user-status">
                <button id="btnLogin" class="login-btn" onclick="window.location.href='/login.html'">登录</button>
                <button id="btnRegister" class="register-btn" onclick="window.location.href='/register.html'">注册</button>
            </div>
            <div id="userInfo" class="user-info" style="display: none;">
                <span id="userNickname" class="user-nickname">用户</span>
                <button class="settings-btn" id="btnSettings" title="设置">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main-container">
        <!-- 操作按钮组 -->
        <div class="action-buttons">
            <button class="action-btn action-btn-primary" id="btnCreateRoom">
                <span class="action-btn-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </span>
                创建房间
            </button>
            <button class="action-btn action-btn-primary" id="btnQuickMatch">
                <span class="action-btn-icon">
                    <svg viewBox="0 0 24 24">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </span>
                快速匹配
            </button>
            <button class="action-btn action-btn-secondary" id="btnRefresh">
                <span class="action-btn-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </span>
                刷新列表
            </button>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <div class="search-input-wrapper">
                <div class="search-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索房间名称或ID...">
            </div>
            <select class="filter-dropdown" id="filterStatus">
                <option value="all">全部状态</option>
                <option value="waiting">等待中</option>
                <option value="playing">游戏中</option>
                <option value="full">已满员</option>
            </select>
            <select class="filter-dropdown" id="filterPlayers">
                <option value="all">全部人数</option>
                <option value="1-3">1-3人</option>
                <option value="4-6">4-6人</option>
                <option value="7-8">7-8人</option>
            </select>
        </div>

        <!-- 房间列表 -->
        <div class="section-header">
            <h2 class="section-title">
                <span class="section-title-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                </span>
                房间列表
            </h2>
        </div>

        <div class="rooms-grid" id="roomsGrid">
            <!-- 房间卡片会动态生成 -->
        </div>
    </main>

    <!-- 创建房间弹窗 -->
    <div class="modal-overlay" id="createRoomModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">创建新房间</h2>
                <p class="modal-subtitle">设置房间参数，邀请好友一起玩</p>
            </div>

            <form id="createRoomForm">
                <div class="form-group">
                    <label class="form-label">房间名称</label>
                    <input type="text" class="form-input" id="roomName" placeholder="输入房间名称（最多20字）" maxlength="20">
                </div>

                <div class="form-group">
                    <label class="form-label">你的昵称</label>
                    <input type="text" class="form-input" id="playerNickname" placeholder="输入你的昵称（最多12字）" maxlength="12">
                </div>

                <div class="form-group">
                    <label class="form-label">选择头像（随机）</label>
                    <div class="avatar-selector">
                        <div class="avatar-preview" id="avatarPreview"></div>
                        <button type="button" class="avatar-refresh-btn" id="refreshAvatar">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                            随机切换
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">最大人数</label>
                        <select class="form-select" id="maxPlayers">
                            <option value="4">4人</option>
                            <option value="6">6人</option>
                            <option value="8" selected>8人</option>
                            <option value="10">10人</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">回合时间</label>
                        <select class="form-select" id="roundTime">
                            <option value="60">60秒</option>
                            <option value="90" selected>90秒</option>
                            <option value="120">120秒</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">游戏类型</label>
                        <select class="form-select" id="gameMode">
                            <option value="classic" selected>经典模式（你画我猜）</option>
                            <option value="gobang">五子棋对战</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">房间类型</label>
                        <select class="form-select" id="roomType">
                            <option value="public" selected>公开房间</option>
                            <option value="private">私密房间</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" class="checkbox" id="allowChat" checked>
                        <label class="checkbox-label">允许聊天</label>
                    </div>
                </div>

                <div class="form-group" id="passwordGroup" style="display: none;">
                    <label class="form-label">房间密码</label>
                    <input type="password" class="form-input" id="roomPassword" placeholder="设置房间密码（可选）" maxlength="20">
                </div>
            </form>

            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" id="btnCancelCreate">取消</button>
                <button class="modal-btn modal-btn-primary" id="btnConfirmCreate">创建房间</button>
            </div>
        </div>
    </div>

    <!-- 快速匹配提示 -->
    <div class="quick-match-toast" id="quickMatchToast">
        <div class="quick-match-spinner"></div>
        <div class="quick-match-text">正在为你匹配合适的房间...</div>
    </div>

    <!-- 加入房间弹窗 -->
    <div class="modal-overlay" id="joinRoomModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">加入房间</h2>
                <button class="modal-close" id="btnCloseJoin">&times;</button>
            </div>

            <form id="joinRoomForm">
                <div class="form-group">
                    <label class="form-label">房间号</label>
                    <input type="text" class="form-input" id="joinRoomCode" placeholder="输入4位房间号" maxlength="4" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">房间名称</label>
                    <input type="text" class="form-input" id="joinRoomName" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">你的昵称</label>
                    <input type="text" class="form-input" id="joinNickname" placeholder="输入你的昵称（最多12字）" maxlength="12">
                </div>

                <div class="form-group">
                    <label class="form-label">选择头像（随机）</label>
                    <div class="avatar-selector">
                        <div class="avatar-preview" id="joinAvatarPreview"></div>
                        <button type="button" class="avatar-refresh-btn" id="refreshJoinAvatar">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                            随机切换
                        </button>
                    </div>
                </div>

                <div class="form-group" id="joinPasswordGroup" style="display: none;">
                    <label class="form-label">房间密码</label>
                    <input type="password" class="form-input" id="joinPassword" placeholder="输入房间密码" maxlength="20">
                </div>
            </form>

            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" id="btnCancelJoin">取消</button>
                <button class="modal-btn modal-btn-primary" id="btnConfirmJoin">加入房间</button>
            </div>
        </div>
    </div>

    <!-- 外部脚本引用 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/security.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/avatar-library.js"></script>
    <script src="js/bgm-manager.js"></script>
    <script src="js/leaderboard-widget.js"></script>
    <script src="js/lobby.js"></script>

    <!-- 背景音乐 -->
    <audio id="bgm" loop preload="auto">
        <source src="background_music/GameRoom.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 初始化 BGM 管理器
        window.addEventListener('DOMContentLoaded', () => {
            window.initBGM('bgm');
        });

        // 检查用户登录状态
        function checkUserStatus() {
            const userInfo = localStorage.getItem('userInfo');
            const accessToken = localStorage.getItem('accessToken');
            
            const userStatusDiv = document.getElementById('userStatus');
            const userInfoDiv = document.getElementById('userInfo');
            const userNicknameSpan = document.getElementById('userNickname');
            
            if (accessToken && userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    // 已登录
                    userStatusDiv.style.display = 'none';
                    userInfoDiv.style.display = 'flex';
                    userNicknameSpan.textContent = user.nickname || '用户';
                } catch (e) {
                    // 数据解析失败，显示登录按钮
                    userStatusDiv.style.display = 'flex';
                    userInfoDiv.style.display = 'none';
                }
            } else {
                // 未登录，显示登录/注册按钮
                userStatusDiv.style.display = 'flex';
                userInfoDiv.style.display = 'none';
            }
        }
        
        // 页面加载时检查用户状态
        checkUserStatus();
        
        // 设置按钮跳转
        document.getElementById('btnSettings')?.addEventListener('click', () => {
            window.location.href = '/settings.html';
        });
    </script>
</body>
</html>
