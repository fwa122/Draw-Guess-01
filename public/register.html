<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 你画我猜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --error: #ef4444;
            --success: #22c55e;
        }
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 50%, #fef3c7 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .form-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }
        .form-input.error {
            border-color: var(--error);
        }
        .btn-primary {
            background: var(--accent);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .link-btn {
            color: var(--accent);
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .link-btn:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass rounded-2xl shadow-xl w-full max-w-md p-8">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">你画我猜</h1>
            <p class="text-slate-500">注册新账号</p>
        </div>

        <!-- 消息提示 -->
        <div id="messageBox" class="hidden mb-4 p-3 rounded-lg text-center text-sm"></div>

        <!-- 注册表单 -->
        <form id="registerForm" class="space-y-4">
            <!-- 邮箱 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">邮箱 <span class="text-red-500">*</span></label>
                <div class="flex gap-2">
                    <input type="email" id="email" class="form-input flex-1 px-4 py-3 rounded-xl" placeholder="请输入邮箱" required>
                    <button type="button" id="sendCodeBtn" class="px-4 py-3 rounded-xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition-colors whitespace-nowrap" onclick="sendCode()">
                        发送验证码
                    </button>
                </div>
            </div>

            <!-- 验证码 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">验证码 <span class="text-red-500">*</span></label>
                <input type="text" id="verifyCode" class="form-input w-full px-4 py-3 rounded-xl" placeholder="请输入6位验证码" maxlength="6" required>
            </div>

            <!-- 密码 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">密码 <span class="text-red-500">*</span></label>
                <div class="relative">
                    <input type="password" id="password" class="form-input w-full px-4 py-3 rounded-xl pr-12" placeholder="至少8位，包含字母和数字" required>
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" onclick="togglePassword('password')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <!-- 密码强度指示器 -->
                <div class="mt-2">
                    <div class="password-strength bg-slate-200" id="strengthBar"></div>
                    <p class="text-xs text-slate-400 mt-1" id="strengthText">请输入密码</p>
                </div>
            </div>

            <!-- 确认密码 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">确认密码 <span class="text-red-500">*</span></label>
                <div class="relative">
                    <input type="password" id="confirmPassword" class="form-input w-full px-4 py-3 rounded-xl pr-12" placeholder="请再次输入密码" required>
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" onclick="togglePassword('confirmPassword')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- 昵称（可选） -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">昵称 <span class="text-slate-400 text-xs">(可选)</span></label>
                <input type="text" id="nickname" class="form-input w-full px-4 py-3 rounded-xl" placeholder="给自己起个昵称吧" maxlength="16">
            </div>

            <!-- 注册按钮 -->
            <button type="submit" class="btn-primary w-full py-3 rounded-xl text-white font-medium">
                注册并登录
            </button>
        </form>

        <!-- 底部链接 -->
        <div class="mt-6 text-center text-sm text-slate-500">
            已有账号？<span class="link-btn" onclick="goToLogin()">点击登录</span>
        </div>

        <!-- 游客入口 -->
        <div class="mt-6 pt-6 border-t border-slate-200 text-center">
            <button class="text-slate-500 hover:text-slate-700 text-sm" onclick="guestLogin()">
                暂不注册，以游客身份进入
            </button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        // 显示消息
        function showMessage(text, type = 'error') {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = `mb-4 p-3 rounded-lg text-center text-sm ${type === 'error' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`;
            box.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('messageBox').classList.add('hidden');
        }

        // 切换密码显示
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // 发送验证码
        let sendCooldown = 0;
        async function sendCode() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMessage('请输入邮箱');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('请输入有效的邮箱地址');
                return;
            }

            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/auth/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, type: 'register' })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    startCooldown(60);
                } else {
                    showMessage(data.error || '发送失败');
                    if (data.remainingTime) {
                        startCooldown(data.remainingTime);
                    } else {
                        btn.disabled = false;
                    }
                }
            } catch (e) {
                showMessage('网络错误，请重试');
                btn.disabled = false;
            }
        }

        function startCooldown(seconds) {
            sendCooldown = seconds;
            const btn = document.getElementById('sendCodeBtn');
            const timer = setInterval(() => {
                sendCooldown--;
                if (sendCooldown > 0) {
                    btn.textContent = `${sendCooldown}秒`;
                } else {
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                    clearInterval(timer);
                }
            }, 1000);
        }

        // 密码强度检测
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            const colors = ['#ef4444', '#f59e0b', '#eab308', '#22c55e'];
            const texts = ['弱', '一般', '中等', '强'];

            if (password.length === 0) {
                strengthBar.style.width = '0%';
                strengthBar.style.background = '#e2e8f0';
                strengthText.textContent = '请输入密码';
            } else if (strength <= 1) {
                strengthBar.style.width = '25%';
                strengthBar.style.background = colors[0];
                strengthText.textContent = '密码强度：弱';
                strengthText.style.color = colors[0];
            } else if (strength === 2) {
                strengthBar.style.width = '50%';
                strengthBar.style.background = colors[1];
                strengthText.textContent = '密码强度：一般';
                strengthText.style.color = colors[1];
            } else if (strength === 3) {
                strengthBar.style.width = '75%';
                strengthBar.style.background = colors[2];
                strengthText.textContent = '密码强度：中等';
                strengthText.style.color = colors[2];
            } else {
                strengthBar.style.width = '100%';
                strengthBar.style.background = colors[3];
                strengthText.textContent = '密码强度：强';
                strengthText.style.color = colors[3];
            }
        });

        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('verifyCode').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const nickname = document.getElementById('nickname').value.trim();

            // 验证
            if (!email || !code || !password || !confirmPassword) {
                showMessage('请填写完整信息');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致');
                return;
            }

            if (password.length < 8) {
                showMessage('密码长度不能少于8位');
                return;
            }

            if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                showMessage('密码必须包含字母和数字');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, password, nickname })
                });
                const data = await res.json();

                if (data.success) {
                    // 保存 Token
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('userInfo', JSON.stringify(data.user));
                    localStorage.setItem('clientId', data.user.clientId);

                    showMessage('注册成功，正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = '/lobby.html';
                    }, 1000);
                } else {
                    showMessage(data.error || '注册失败');
                }
            } catch (e) {
                showMessage('网络错误，请重试');
            }

            btn.disabled = false;
            btn.textContent = '注册并登录';
        });

        // 页面跳转
        function goToLogin() {
            window.location.href = '/login.html';
        }

        function guestLogin() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('userInfo');
            
            if (!localStorage.getItem('clientId')) {
                localStorage.setItem('clientId', 'guest_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));
            }
            
            window.location.href = '/lobby.html';
        }

        // 检查是否已登录
        if (localStorage.getItem('accessToken')) {
            window.location.href = '/lobby.html';
        }
    </script>
</body>
</html>
