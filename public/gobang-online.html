<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋对战 - 你画我猜游戏平台</title>
    <link rel="stylesheet" href="/css/gobang.css">
    <link rel="stylesheet" href="/css/toast.css">
    <style>
        /* 联机模式额外样式 */
        .room-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .room-code-display {
            font-weight: 700;
            color: var(--accent);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.connected {
            background: var(--success);
        }

        .status-dot.disconnected {
            background: var(--error);
        }

        .waiting-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .waiting-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
        }

        .waiting-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .waiting-text {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .waiting-subtext {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .opponent-left {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(239, 68, 68, 0.95);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            z-index: 1001;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 房间状态与玩家状态标签 */
        .room-status {
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .room-status.ready {
            background: rgba(34, 197, 94, 0.15);
            color: #16a34a;
        }

        .room-status.playing {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
        }

        .status-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .status-badge.waiting {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-secondary);
        }

        .status-badge.ready {
            background: rgba(34, 197, 94, 0.15);
            color: #16a34a;
        }

        .status-badge.playing {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
        }

        .status-badge.empty {
            background: rgba(203, 213, 225, 0.3);
            color: #94a3b8;
        }

        /* 游戏操作按钮 */
        .game-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
        }

        .btn-ready, .btn-start {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ready {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }

        .btn-ready:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-ready:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-start {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-start:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-ready svg, .btn-start svg {
            width: 16px;
            height: 16px;
        }

        .player-card .player-status {
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 游戏头部 -->
        <div class="game-header">
            <button class="back-btn" onclick="goBack()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5"/>
                    <path d="M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="game-title">五子棋对战</h1>
            <button class="restart-btn" onclick="surrender()" id="surrenderBtn" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                    <line x1="4" y1="22" x2="4" y2="15"/>
                </svg>
                认输
            </button>
        </div>

        <!-- 房间信息 -->
        <div class="room-info">
            <div>
                房间码: <span class="room-code-display" id="roomCodeDisplay">--</span>
            </div>
            <div class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="connectionStatus">连接中...</span>
            </div>
        </div>

        <!-- 玩家信息 -->
        <div class="players-panel">
            <!-- 黑棋玩家 -->
            <div class="player-card" id="blackPlayer">
                <div class="player-avatar black">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                </div>
                <div class="player-info">
                    <div class="player-name" id="blackPlayerName">等待加入</div>
                    <div class="player-status" id="blackPlayerStatus">
                        <span class="status-badge waiting">等待中</span>
                    </div>
                </div>
                <div class="player-timer" id="blackTimer">--:--</div>
            </div>

            <!-- 游戏状态 -->
            <div class="game-status">
                <div class="room-status" id="roomStatus">等待中</div>
                <div class="current-turn" id="currentTurn">
                    <span class="turn-text">等待对手加入</span>
                </div>
                <div class="move-count" id="moveCount">第 0 手</div>
            </div>

            <!-- 白棋玩家 -->
            <div class="player-card" id="whitePlayer">
                <div class="player-avatar white">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1">
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                </div>
                <div class="player-info">
                    <div class="player-name" id="whitePlayerName">等待加入</div>
                    <div class="player-status" id="whitePlayerStatus">
                        <span class="status-badge empty">未加入</span>
                    </div>
                </div>
                <div class="player-timer" id="whiteTimer">--:--</div>
            </div>
        </div>

        <!-- 游戏操作区 -->
        <div class="game-actions" id="gameActions">
            <button class="btn-ready" id="readyBtn" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                准备
            </button>
            <button class="btn-start" id="startBtn" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                开始游戏
            </button>
        </div>

        <!-- 游戏棋盘 -->
        <div class="board-container">
            <canvas id="gobangBoard" width="600" height="600"></canvas>
        </div>

        <!-- 历史记录面板 -->
        <div class="history-panel">
            <h3 class="history-title">落子记录</h3>
            <div class="history-list" id="historyList">
                <div class="history-empty">暂无记录</div>
            </div>
        </div>

        <!-- 观战者面板 -->
        <div class="spectators-panel" id="spectatorsPanel" style="display: none;">
            <h3 class="spectators-title">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                观战者
            </h3>
            <div class="spectators-list" id="spectatorsList">
                <div class="spectators-empty">暂无观战者</div>
            </div>
        </div>
    </div>

    <!-- 等待对手弹窗 -->
    <div class="waiting-overlay" id="waitingOverlay">
        <div class="waiting-content">
            <div class="waiting-spinner"></div>
            <div class="waiting-text" id="waitingText">等待对手加入...</div>
            <div class="waiting-subtext" id="waitingSubtext">房间码: <strong id="waitingRoomCode">--</strong></div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-content">
            <div class="winner-icon" id="winnerIcon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10"/>
                </svg>
            </div>
            <h2 class="winner-text" id="winnerText">黑方获胜</h2>
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">总手数</span>
                    <span class="stat-value" id="totalMoves">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">用时</span>
                    <span class="stat-value" id="totalTime">00:00</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="goBack()">返回大厅</button>
                <button class="btn btn-primary" onclick="playAgain()">再来一局</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/gobang-online.js"></script>
</body>
</html>
